<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Three.js — Table Lamp & Fern</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; background: #8b9aa6; }
    #c { width: 100%; height: 100%; display: block; }
    #info { position: fixed; left: 12px; bottom: 12px; color: #f5efe6; font: 12px/1.4 system-ui, sans-serif; opacity: .9 }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="info">Table lamp (composite) and potted fern (polygonal mesh). Orthographic view. Drag to orbit • Wheel to zoom</div>
  <script type="module" src="./main.js"></script>
</body>
</html>
